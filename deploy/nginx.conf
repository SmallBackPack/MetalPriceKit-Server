# MetalPriceKit Server —— Nginx 站点配置
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/metalpricekit-server
#   sudo ln -s /etc/nginx/sites-available/metalpricekit-server /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书用 certbot 申请（先把 server_name 换成真域名）：
#   sudo certbot --nginx -d api.example.com

# limit_req_zone 只能放在 http 块里，所以这里只放 server 块，
# 实际使用时把它并进 /etc/nginx/nginx.conf 的 http 块。
# 应用层还有一层 IP 限流兜底（60/min），两层都留着。

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 客户端要拿到真实 IP，限流与日志才准。
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 密文本身压不动，但 bootstrap 公钥表和品种字典压一下没坏处。
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # ── IP 层限流兜底（60 req/min）─────────────────────────────
    limit_req_zone $binary_remote_addr zone=mpk_ip:10m rate=60r/m;

    location / {
        limit_req zone=mpk_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ── 运营后台：公网一律拒绝 ─────────────────────────────────
    #
    # 后台只走 SSH 隧道访问，不对外暴露。
    # 双保险：服务端本来也只监听 127.0.0.1，但万一有人把 HOST 改成 0.0.0.0，
    # 这一条还在，公网上依然访问不到后台。
    location /admin {
        deny all;
        return 403;
    }

    # ── 探活：不加密、不限流、可以给外部监控用 ──────────────────
    location = /health {
        limit_req off;
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
